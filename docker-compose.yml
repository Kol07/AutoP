services:
  frontend:
    build: path

  backend:
    build: ./backend

    environment:
      VLLM_EMBED_URL: ${VLLM_EMBED_URL}
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  
  db:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: AutoPOROTW_DB
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "7100:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  
  adminer:
    image: adminer
    ports:
      - "7101:8080"


  vllm-embed:
    image: vllm/vllm-openai:v0.29.0-cu129
    ports:
      - "7000:8000" # remove when deploying, only for host to talk to it, ie testing
    
    gpus:
      - driver: nvidia
        device_ids: ["2"]
        capabilities: [gpu]

    volumes:
      - ./models/qwen3-embedding-4b:/models/qwen3-embedding-4b:ro

    command: 
      - --model
      - ${VLLM_EMBED_MODEL}
      - --gpu-memory-utilization
      - "0.15" # 15% of 80GB

volumes:
 postgres_data: