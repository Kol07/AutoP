services:
  frontend:
    build: path

  backend:
    build: ./backend

    environment:
      VLLM_EMBED_URL: ${VLLM_EMBED_URL}
      VLLM_EMBED_MODEL: ${VLLM_EMBED_MODEL:-/models/qwen3-embedding-4b}
      VLLM_EMBED_MODEL_REVISION: ${VLLM_EMBED_MODEL_REVISION:-v1 22092026}
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-10}
      VLLM_LLM_URL: ${VLLM_LLM_URL}
      VLLM_LLM_MODEL: ${VLLM_LLM_MODEL:-/models/qwen3.8-27B-FP8}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-10}
      CLASSIFICATION_GUIDELINE_WEIGHT: ${CLASSIFICATION_GUIDELINE_WEIGHT:-0.60}
      CLASSIFICATION_SIMILARITY_WEIGHT: ${CLASSIFICATION_SIMILARITY_WEIGHT:-0.30}
      CLASSIFICATION_MOTHERHOOD_WEIGHT: ${CLASSIFICATION_MOTHERHOOD_WEIGHT:-0.10}
      GUIDELINE_HIT_CAP: ${GUIDELINE_HIT_CAP:-3}
      SIMILARITY_TOP_K: ${SIMILARITY_TOP_K:-5}
      SIMILARITY_MINIMUM_SCORE: ${SIMILARITY_MINIMUM_SCORE:-0.70}
      SIMILARITY_RELEVANCE_THRESHOLD: ${SIMILARITY_RELEVANCE_THRESHOLD:-0.50}
      CLASSIFICATION_RELEVANCE_THRESHOLD: ${CLASSIFICATION_RELEVANCE_THRESHOLD:-0.50}
      CLASSIFICATION_CONCURRENCY: ${CLASSIFICATION_CONCURRENCY:-10}
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  
  db:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: AutoPOROTW_DB
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "7100:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  
  adminer:
    image: adminer
    ports:
      - "7101:8080"


  vllm-embed:
    image: vllm/vllm-openai:v0.29.0-cu129
    ports:
      - "7000:8000" # remove when deploying, only for host to talk to it, ie testing
    
    gpus:
      - driver: nvidia
        device_ids: ["2"]
        capabilities: [gpu]

    volumes:
      - ./models/qwen3-embedding-4b:/models/qwen3-embedding-4b:ro

    command: 
      - --model
      - ${VLLM_EMBED_MODEL:-/models/qwen3-embedding-4b}
      - --gpu-memory-utilization
      - "0.15" # 15% of 80GB
  
  vllm-llm:
    image: vllm/vllm-openai:v0.29.0-cu129
    ports:
      - "7001:8000" # remove when deploying, only for host to talk to it, ie testing
    
    gpus:
      - driver: nvidia
        device_ids: ["2"]
        capabilities: [gpu]

    volumes:
      - ./models/qwen3.8-27B-FP8:/models/qwen3.8-27B-FP8:ro

    command: 
      - --model
      - ${VLLM_LLM_MODEL:-/models/qwen3.8-27B-FP8}
      - --gpu-memory-utilization
      - "0.55" # 55% of 80GB
      - --max-model-len
      - "32768" # 32k tokens, model allows up to 200k but we probably don't need that much to fit guidelines + article content, 32k should be extremly comfortable

volumes:
 postgres_data:
